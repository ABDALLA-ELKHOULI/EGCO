# بناء المثبّتات في السحابة — يعمل عند دفع وسم إصدار مثل v0.5.0
#
# Pushing a tag `v*` builds the Windows NSIS installer and the macOS DMG on
# GitHub's machines and attaches both to a GitHub Release. The installed apps
# see that release and offer the in-app update. No building on the office
# machine ever again.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # electron-builder uploads the installers to the Release

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install JS dependencies
        run: npm ci || npm install

      - name: Python venv + backend dependencies
        run: npm run setup

      # ‏CI يبني الحزم؛ الاختبار المرجعي يقع محلياً قبل الوسم حيث تتوفّر العيّنات
      # ‏(كشوف حسابات حقيقية لا تُرفع إلى مستودع عام). ما لا يُختبَر هنا يُعلَن
      # ‏صراحةً في ملخّص التشغيل بدل أن يمرّ «أخضر» فيُقرأ كأن كل شيء اختُبر.
      - name: Backend tests
        # ‏shell: bash إلزامي — المصفوفة تشمل windows-latest وصدفتها الافتراضية
        # ‏PowerShell، ولا تفهم tee ولا grep -oE ولا || echo. أول محاولة فشلت هنا.
        shell: bash
        run: npm run test:api 2>&1 | tee pytest.out

      - name: أعلِن ما لم يُختبَر
        if: always()
        shell: bash
        run: |
          SKIPPED=$(grep -oE '[0-9]+ skipped' pytest.out 2>/dev/null | head -1 | grep -oE '[0-9]+' || echo 0)
          PASSED=$(grep -oE '[0-9]+ passed' pytest.out 2>/dev/null | head -1 | grep -oE '[0-9]+' || echo 0)
          echo "### نتيجة اختبارات الخادم" >> $GITHUB_STEP_SUMMARY
          echo "- ناجح: **$PASSED**" >> $GITHUB_STEP_SUMMARY
          echo "- **متخطّى: $SKIPPED**" >> $GITHUB_STEP_SUMMARY
          if [ "$SKIPPED" -gt 0 ]; then
            echo "::warning::$SKIPPED اختباراً لم يُشغَّل — العيّنات غير متاحة في CI. راجع docs/testing-samples.md" 
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> ⚠️ هذه الحزمة بُنيت دون تشغيل \$SKIPPED اختباراً من اختبارات الانحدار." >> $GITHUB_STEP_SUMMARY
            echo "> التشغيل المرجعي الكامل يقع محلياً قبل الوسم." >> $GITHUB_STEP_SUMMARY
          fi

      # ‏م-٤٧: اختبارات الواجهة (Playwright) — تُفشل البناء. الخادم المؤقت يُبذر
      # ‏ببيانات مصنوعة (EGCO_SEED=1، قاعدة مؤقتة) فلا يحتاج عيّنات حقيقية.
      # ‏اللقطات البصرية المرجعية مولَّدة على macOS وتُقارَن هناك فقط (الخطوط تختلف)؛
      # ‏على ويندوز تُتخطّى visual.spec.ts نفسها (test.skip داخلها) ويعمل الباقي.
      # ‏shell: bash إلزامي — المصفوفة تشمل windows-latest.
      - name: تثبيت متصفح Playwright
        shell: bash
        run: npx playwright install --with-deps chromium

      - name: اختبارات الواجهة
        shell: bash
        env:
          CI: 'true'
          E2E_CHANNEL: bundled
        run: npm run e2e

      - name: أثر اختبارات الواجهة عند الفشل
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: apps/renderer/e2e/.results/
          if-no-files-found: ignore
          retention-days: 7

      # ‏م-٣٣: يمنع شحن نسخة فيها ميزة جديدة بلا مدخل في whatsNew.ts — القاعدة
      # ‏الورقية في CLAUDE.md §٨ لم تصمد يوماً واحداً (v0.11.0 وv0.11.1 وصلتا
      # ‏بلا إعلان). shell: bash إلزامي لنفس سبب خطوة اختبارات الخادم أعلاه —
      # ‏المصفوفة تشمل windows-latest.
      - name: تحقّق من جولة «ما الجديد»
        shell: bash
        run: node scripts/check-whats-new.mjs

      # ‏م-٣٨-٢: أول تشغيل لـESLint في هذا المشروع وجد ٢٣٤ خطأ (٢٢٧ منها
      # ‏no-explicit-any) و١٠ تحذيرات في src/ — ليست ملفاً ملكنا لنصلحه هنا.
      # ‏continue-on-error: true عمداً حتى تُنظَّف الشيفرة في موجة لاحقة؛ الخطوة
      # ‏موجودة فقط لتُظهر العدد في كل تشغيل بدل أن يبقى مجهولاً.
      - name: ESLint (تحذير فقط — لا يُفشل البناء بعد)
        shell: bash
        continue-on-error: true
        run: npm --workspace apps/renderer run lint

      # ‏مفتاح بلاغات الدعم يُحقن هنا من سرّ المستودع — لا يُكتب في الكود أبداً لأن
      # ‏المستودع عام. صلاحيته على مستودع البلاغات وحده (EGCO-reports)، لا على هذا
      # ‏المستودع: مفتاحٌ يكتب هنا يستطيع نشر تحديث إلى جهاز الشركة. بلا السرّ تُبنى
      # ‏النسخة وتحفظ البلاغات محلياً — لا يفشل البناء.
      - name: مفتاح بلاغات الدعم
        shell: bash
        env:
          EGCO_REPORT_TOKEN: ${{ secrets.EGCO_REPORT_TOKEN }}
          EGCO_REPORT_REPO: ${{ vars.EGCO_REPORT_REPO }}
        run: |
          mkdir -p apps/desktop/dist
          if [ -n "$EGCO_REPORT_TOKEN" ]; then
            node -e "require('fs').writeFileSync('apps/desktop/dist/support.json', JSON.stringify({token: process.env.EGCO_REPORT_TOKEN, repo: process.env.EGCO_REPORT_REPO || 'ABDALLA-ELKHOULI/EGCO-reports'}))"
            echo "- بلاغات الدعم: **مفعّلة**" >> $GITHUB_STEP_SUMMARY
          else
            echo "- بلاغات الدعم: **غير مفعّلة** (السرّ EGCO_REPORT_TOKEN غير موجود — تُحفظ محلياً)" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build and publish installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build && npm run build:api && npx electron-builder --config electron-builder.yml --publish always
