# بناء المثبّتات في السحابة — يعمل عند دفع وسم إصدار مثل v0.5.0
#
# Pushing a tag `v*` builds the Windows NSIS installer and the macOS DMG on
# GitHub's machines and attaches both to a GitHub Release. The installed apps
# see that release and offer the in-app update. No building on the office
# machine ever again.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # electron-builder uploads the installers to the Release

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install JS dependencies
        run: npm ci || npm install

      - name: Python venv + backend dependencies
        run: npm run setup

      # ‏CI يبني الحزم؛ الاختبار المرجعي يقع محلياً قبل الوسم حيث تتوفّر العيّنات
      # ‏(كشوف حسابات حقيقية لا تُرفع إلى مستودع عام). ما لا يُختبَر هنا يُعلَن
      # ‏صراحةً في ملخّص التشغيل بدل أن يمرّ «أخضر» فيُقرأ كأن كل شيء اختُبر.
      - name: Backend tests
        # ‏shell: bash إلزامي — المصفوفة تشمل windows-latest وصدفتها الافتراضية
        # ‏PowerShell، ولا تفهم tee ولا grep -oE ولا || echo. أول محاولة فشلت هنا.
        shell: bash
        run: npm run test:api 2>&1 | tee pytest.out

      - name: أعلِن ما لم يُختبَر
        if: always()
        shell: bash
        run: |
          SKIPPED=$(grep -oE '[0-9]+ skipped' pytest.out 2>/dev/null | head -1 | grep -oE '[0-9]+' || echo 0)
          PASSED=$(grep -oE '[0-9]+ passed' pytest.out 2>/dev/null | head -1 | grep -oE '[0-9]+' || echo 0)
          echo "### نتيجة اختبارات الخادم" >> $GITHUB_STEP_SUMMARY
          echo "- ناجح: **$PASSED**" >> $GITHUB_STEP_SUMMARY
          echo "- **متخطّى: $SKIPPED**" >> $GITHUB_STEP_SUMMARY
          if [ "$SKIPPED" -gt 0 ]; then
            echo "::warning::$SKIPPED اختباراً لم يُشغَّل — العيّنات غير متاحة في CI. راجع docs/testing-samples.md" 
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> ⚠️ هذه الحزمة بُنيت دون تشغيل \$SKIPPED اختباراً من اختبارات الانحدار." >> $GITHUB_STEP_SUMMARY
            echo "> التشغيل المرجعي الكامل يقع محلياً قبل الوسم." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build and publish installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build && npm run build:api && npx electron-builder --config electron-builder.yml --publish always
